<!DOCTYPE html>
<html>
<head>
  <title>Smart Campus - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-box">
  <h2>Smart Campus Portal</h2>
  <p>Book rooms, equipment & report issues</p>
  <input id="email" placeholder="Enter any email">
  <select id="role">
    <option value="student">Student</option>
    <option value="staff">Staff</option>
    <option value="admin">Admin</option>
  </select>
  <button onclick="login()">Login</button>
  <p class="hint">For Judge: <br>student@test.com = Student<br>admin@test.com = Admin</p>
</div>
<script src="script.js"></script>
</body>
</html>
